[supervisord]
nodaemon=true
# Default entry may still be root so nginx can bind :80 (privileged port).
# Drop privileges per-program where possible. For full non-root container:
#   --user 10001:10001 -e NGINX_PORT=8080  (port must be >= 1024)
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=false
startretries=0
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log
priority=100
# nginx master typically needs root for :80; workers drop privileges themselves.
# When the whole container runs as app (NGINX_PORT>=1024), entry user is already non-root.

[program:mcp-server]
command=node -r ./preload-env.cjs dist/start.cjs --transport=http --host=127.0.0.1 --port=3000
directory=/app/mcp-server
user=app
autostart=true
autorestart=false
startretries=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=200
environment=NODE_ENV=production,NODE_PATH=/app

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
