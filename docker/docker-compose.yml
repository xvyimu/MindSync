services:
  prompt-optimizer:
    image: linshen/prompt-optimizer:latest
#     Alternatively, you can build from source:
#     build:
#        context: ..
#        dockerfile: Dockerfile
    container_name: prompt-optimizer
    restart: unless-stopped
    ports:
      - "28081:${NGINX_PORT:-80}"      # Web应用端口（包含MCP服务器，通过/mcp路径访问）
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://localhost:${NGINX_PORT:-80}/healthz >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      # nginx内部端口配置
      - NGINX_PORT=${NGINX_PORT:-80}

      # Optional browser public config only (VITE_APP_* / VITE_PUBLIC_*).
      # Model API keys are NOT injected into config.js anymore; users set keys in the UI.
      # MCP server still uses its own env (MCP_*) for tool-side model calls.
      # Legacy VITE_*_API_KEY vars are intentionally omitted from this compose file.

      # MCP服务器配置（Docker内部固定端口3000，不使用MCP_HTTP_PORT）
      # - MCP_HTTP_PORT=${MCP_HTTP_PORT:-3000}  # Docker中固定使用3000端口
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN is required}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-}
      - MCP_HTTP_BODY_LIMIT=${MCP_HTTP_BODY_LIMIT:-256kb}
      - MCP_MAX_SESSIONS=${MCP_MAX_SESSIONS:-100}
      - MCP_SESSION_TTL_MS=${MCP_SESSION_TTL_MS:-1800000}
      - MCP_LOG_LEVEL=${MCP_LOG_LEVEL:-debug}
      - MCP_DEFAULT_LANGUAGE=${MCP_DEFAULT_LANGUAGE:-zh-CN}
      - MCP_DEFAULT_MODEL_PROVIDER=${MCP_DEFAULT_MODEL_PROVIDER:-openai}



      # Basic auth — required for any compose-based deploy (local open access: set a password
      # you control, or run with a reverse proxy that terminates auth elsewhere).
      # Empty password used to silently disable auth; that is unsafe for exposed hosts.
      - ACCESS_USERNAME=${ACCESS_USERNAME:-admin}
      - ACCESS_PASSWORD=${ACCESS_PASSWORD:?ACCESS_PASSWORD is required — set a strong value for any exposed host}
    security_opt:
      - no-new-privileges:true
