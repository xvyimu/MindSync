packages:
  - packages/*
# pnpm 11: lifecycle allowlist + overrides live here (package.json "pnpm" key ignored).
# W1 (2026-07): allow electron/esbuild/msw/protobufjs so desktop + vite postinstall work under 11.5.
# Removed ignoredBuiltDependencies (conflicted with allowBuilds; CI can still use cache).
# MS-deps-sec (2026-07-24): security-now transitive pins only (no majors).
# MS-deps-sec (2026-07-28): electron-builder high (#116/#117) → app-builder-lib≥26.15 + builder-util-runtime≥9.7.
# pnpm 11 only reads auth/registry keys from .npmrc; the settings below used to live
# there and were silently inert (root node_modules had 8 entries, so hoist-dependent
# gates -- typecheck:web's vue-tsc, check-locale-parity's typescript -- failed).
# Migrated 2026-08-03. shamefullyHoist supersedes the old public-hoist-pattern entries.
shamefullyHoist: true
engineStrict: true
autoInstallPeers: true
strictPeerDependencies: false
enablePrePostScripts: true
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  msw: true
  protobufjs: true
overrides:
  # Keep CodeMirror types single-versioned for @mindsync/ui's vue-tsc build.
  '@codemirror/state': 6.7.1
  '@codemirror/view': 6.43.6
  tar: '>=7.5.19 <8'
  protobufjs: '>=7.6.5 <8'
  hono: '>=4.12.27 <5'
  # #98 medium needs major 2.x; keep <2 until MCP SDK peers allow (DEFER documented)
  '@hono/node-server': '>=1.19.13 <2'
  # electron-builder 26.15+ brings these; pin floor so old 9.5.1 cannot re-enter
  app-builder-lib: '>=26.15.0 <27'
  builder-util-runtime: '>=9.7.0 <10'
  fast-uri: '>=3.1.4 <4'
  linkify-it: '>=5.0.2 <6'
  js-yaml: '>=4.3.0 <5'
  form-data: '>=4.0.6 <5'
  ws: '>=8.21.0 <9'
  tmp: '>=0.2.6 <0.3'
  qs: '>=6.15.2 <7'
  js-cookie: '>=3.0.7 <4'
  '@xmldom/xmldom': '>=0.8.13 <0.9'
  lodash: '>=4.18.0 <5'
  lodash-es: '>=4.18.0 <5'
  # GHSA-mh99-v99m-4gvg (high, DoS). Each major line has its own first patched
  # release, so they are pinned per line rather than remapped onto one version --
  # forcing 5.x onto a 1.x/2.x consumer breaks it (minimatch@3 calls the module as
  # a function; 5.x only exports { expand }).
  #
  # Lower bounds, not exact versions: an exact pin stops being a fix the moment the
  # advisory moves, and silently holds the package at a vulnerable version instead.
  #
  # 1.x has no patched release at all -- maintenance-v1 tops out at 1.1.16 and
  # 1.1.17 was never published. DEFER; dev-only, so `audit --prod` stays clean.
  'brace-expansion@1': 1.1.16
  'brace-expansion@2': '>=2.1.3 <3'
  'brace-expansion@5': '>=5.0.8 <6'
  'body-parser@2': '>=2.3.0 <3'
  ip-address: '>=10.1.1 <11'
  undici: '>=7.28.0 <8'
  vite: '>=8.0.16 <9'
  # Dependabot #57 low: esbuild dev-server request spoofing; first patched 0.28.1 (site/ pinned in f2b3dd7).
  esbuild: '>=0.28.1 <1'
  postcss: '>=8.5.10 <9'
  dompurify: '>=3.4.12 <4'
  markdown-it: '>=14.2.0 <15'
  '@anthropic-ai/sdk': '>=0.91.1 <1'
