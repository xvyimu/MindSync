[package]
name = "mindsync-desktop-tauri"
version = "2.11.7"
description = "MindSync desktop shell (Tauri 2) — loads @mindsync/web"
authors = ["xvyimu"]
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.77.2"

[lib]
name = "mindsync_desktop_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# open external URLs / log dirs (shell-openExternal, logs-open-directory)
open = "5"
url = "2"
# public env whitelist (config-getEnvironmentVariables) — Electron runtime-security parity
regex = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
